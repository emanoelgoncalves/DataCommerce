<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lista de Produtos</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

/* TABELA */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    border: 1px solid #999;
    padding: 10px;
    text-align: center;
}

th {
    background: #2c5364;
    color: white;
}

/* IMAGEM */
.img-produto {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 6px;
}

/* BOTÕES AÇÃO */
.acao {
    background: #2c5364;
    color: white;
    padding: 6px 10px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    display: inline-block;
    margin: 2px;
}

.acao.excluir {
    background: #b22222;
}

/* BOTÕES INFERIORES */
.botoes {
    text-align: right;
    margin-top: 20px;
}

.botao {
    background: #2c5364;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    margin-left: 10px;
    display: inline-block;
}

/* RESPONSIVO */
@media (max-width: 800px) {
    table {
        font-size: 12px;
    }

    .img-produto {
        width: 40px;
        height: 40px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Lista de Produtos</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Imagem</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Marca</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Ações</th>
        </tr>

        {% for p in produtos %}
        <tr>
            <td>{{ p.id }}</td>

            <td>
                <img class="img-produto"
                     src="{{ url_for('static', filename='img/' + (p.imagem if p.imagem else 'sem_imagem.jpg')) }}">
            </td>

            <td>{{ p.nome }}</td>
            <td>{{ p.categoria }}</td>
            <td>{{ p.marca }}</td>
            <td>R$ {{ "%.2f"|format(p.preco) }}</td>
            <td>{{ p.estoque }}</td>

            <td>
                <a class="acao" href="/editar_produto/{{ p.id }}">Editar</a>
                <a class="acao excluir" href="/excluir_produto/{{ p.id }}">Excluir</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <div class="botoes">
        <a href="/" class="botao">Início</a>
        <a href="/cadastro" class="botao">Criar Produto</a>
    </div>

</div>

</body>
</html>
