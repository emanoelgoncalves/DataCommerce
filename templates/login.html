<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
}

.container {
    max-width: 420px;
    margin: 100px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input, button {
    padding: 12px;
    font-size: 16px;
}

button {
    background: #2c5364;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.erro {
    color: red;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Login do Funcionário</h1>
    <p>Entre com nome e senha</p>

    {% if mensagem %}
        <div class="erro">{{ mensagem }}</div>
    {% endif %}

    <form method="post">
        <input type="text" name="nome" placeholder="Nome do funcionário" required>
        <input type="password" name="senha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
