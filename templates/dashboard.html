<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Inicial</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1, p {
    text-align: center;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.card {
    background: #eee;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.valor {
    margin-top: 10px;
    font-size: 28px;
    color: #2c5364;
}

.botoes {
    text-align: center;
    margin-top: 25px;
}

.botao {
    background: #2c5364;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    margin: 5px;
    display: inline-block;
}

@media (max-width: 900px) {
    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Dashboard Inicial</h1>
    <p>Bem-vindo, {{ usuario }}</p>

    <div class="cards">
        <div class="card">
            Total de Produtos
            <div class="valor">{{ total_produtos }}</div>
        </div>

        <div class="card">
            Total Vendido Geral
            <div class="valor">{{ total_vendido }}</div>
        </div>

        <div class="card">
            Faturamento Total
            <div class="valor">R$ {{ "%.2f"|format(faturamento) }}</div>
        </div>
    </div>

    <div class="botoes">
        <a href="/produto" class="botao">Entrar no Sistema</a>
        <a href="/produtos" class="botao">Produtos</a>
        <a href="/relatorio" class="botao">Relatórios</a>
        <a href="/logout" class="botao">Sair</a>
    </div>
</div>

</body>
</html>
